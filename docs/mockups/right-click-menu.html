<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#2B2B2B;}
  body{font-family:'Noto Sans','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;}
  .panel{position:absolute;background:#2C2C2C;border:1px solid #4A4A4A;border-radius:8px;
         box-shadow:0 10px 28px rgba(0,0,0,.50),0 2px 6px rgba(0,0,0,.35);
         padding:4px 0 5px;overflow:hidden;}
  .row{height:34px;display:flex;align-items:center;padding:0 0 0 18px;color:#EEEEEE;
       font-size:16px;line-height:1;white-space:nowrap;}
  .row.hi{background:#3D3D3D;}
  .ico{width:17px;height:17px;margin-right:12px;flex:0 0 17px;}
  .chev{margin-left:auto;margin-right:18px;color:#A8A8A8;font-size:15px;line-height:1;}
  .sep{height:1px;background:#454545;margin:5px 16px;}
</style></head><body>

<div class="panel" style="left:26px;top:27px;width:280px;">
  <div class="row"><span class="ico"></span>Play</div>
  <div class="row"><span class="ico"></span>Open with<span class="chev">&#8250;</span></div>
  <div class="sep"></div>
  <div class="row hi"><span class="ico"><svg viewBox="0 0 32 32" width="17" height="17" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="32" height="32" rx="7" ry="7" fill="#12333F"/><path d="M 8.2,6.4 H 23.8 A 3.4,3.4 0 0 1 27.2,9.8 V 16.4 A 3.4,3.4 0 0 1 23.8,19.8 H 14.6 L 11.4,25.6 L 10.4,19.8 H 6.4 A 3.4,3.4 0 0 1 4.8,16.4 V 9.8 A 3.4,3.4 0 0 1 8.2,6.4 Z" fill="#19B0AE"/><rect x="9.6" y="10.4" width="12.6" height="2.6" rx="1.3" fill="#12333F"/><rect x="9.6" y="14.2" width="8.4" height="2.6" rx="1.3" fill="#12333F"/></svg></span>Transcribe in PDF</div>
  <div class="sep"></div>
  <div class="row"><span class="ico"></span>Copy as path</div>
  <div class="row"><span class="ico"></span>Share</div>
  <div class="row"><span class="ico"></span>Send to<span class="chev">&#8250;</span></div>
  <div class="sep"></div>
  <div class="row"><span class="ico"></span>Cut</div>
  <div class="row"><span class="ico"></span>Copy</div>
  <div class="row"><span class="ico"></span>Delete</div>
</div>
</body></html>
